name: Warehouse City checks
on:
  push:
    branches: [main, fix/city-final-hardening]
    paths: ['city*', 'index.html', 'tests/**', 'vendor/**', '.github/workflows/city-ci.yml']
  pull_request:
    paths: ['city*', 'index.html', 'tests/**', 'vendor/**', '.github/workflows/city-ci.yml']
permissions:
  contents: read
jobs:
  core-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test city-core.test.mjs tests/*.test.mjs
      - name: Validate application and vendor modules
        run: |
          for f in city-*.mjs vendor/three.module.js vendor/three.core.min.js vendor/OrbitControls.js; do
            node --input-type=module --check < "$f"
          done
