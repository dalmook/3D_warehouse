name: Warehouse City checks
on:
  push:
    branches: [main, feat/warehouse-city-v9]
    paths: ['city*', 'index.html', 'tests/**', 'vendor/**', '.github/workflows/city-ci.yml']
  pull_request:
    paths: ['city*', 'index.html', 'tests/**', 'vendor/**', '.github/workflows/city-ci.yml']
permissions:
  contents: read
jobs:
  core-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test city-core.test.mjs tests/core-release.test.mjs
      - name: Validate application and vendor modules
        run: |
          node --check city-core.mjs
          node --check city-app.mjs
          node --input-type=module --check < vendor/three.module.js
          node --input-type=module --check < vendor/three.core.min.js
          node --input-type=module --check < vendor/OrbitControls.js
