name: Warehouse City browser QA and Pages
on:
  push:
    branches: [main, fix/city-final-hardening]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: city-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: read
    outputs:
      pages_type: ${{ steps.pages.outputs.type }}
      pages_url: ${{ steps.pages.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and syntax tests
        run: |
          node --test city-core.test.mjs tests/*.test.mjs
          for f in city-app.mjs city-render.mjs city-core.mjs app.js objects.js boot.js vendor/three.module.js vendor/three.core.min.js vendor/OrbitControls.js; do
            node --input-type=module --check < "$f"
          done
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Desktop, mobile, 600-rack stress and classic asset checks
        run: |
          mkdir -p qa-evidence
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/city-http.log 2>&1 &
          node tests/browser.mjs
          node tests/stress.mjs
          node tests/classic.mjs
      - name: Real GitHub save and load with temporary-branch cleanup
        env:
          QA_GITHUB_TOKEN: ${{ github.token }}
        run: node tests/live-github.mjs
      - name: Read existing Pages configuration without changing it
        id: pages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qa-evidence
          gh api repos/dalmook/3D_warehouse/pages > qa-evidence/pages-status.json
          python3 - <<'PY'
          import json,os
          p=json.load(open('qa-evidence/pages-status.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('type='+p['build_type']+'\nurl='+p['html_url']+'\n')
          PY
      - name: Package source and evidence
        if: always()
        run: |
          mkdir -p qa-evidence
          git rev-parse HEAD > qa-evidence/tested-commit.txt
          tar -czf /tmp/city-source.tar.gz --exclude=.git --exclude=node_modules --exclude=qa-evidence .
          cp /tmp/city-source.tar.gz qa-evidence/
          cp /tmp/city-http.log qa-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warehouse-city-qa
          path: qa-evidence/
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/main' && needs.browser.outputs.pages_type == 'workflow'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static website including saved layouts
        run: |
          mkdir _site
          cp index.html city.html classic.html city-app.mjs city-render.mjs city-core.mjs city.css app.js boot.js objects.js styles.css .nojekyll _site/
          cp city-*.mjs _site/
          cp -r vendor licenses layouts _site/
          mkdir -p _site/assets
          cp -r assets/models assets/textures assets/manifest.json _site/assets/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
  published:
    if: always() && github.ref == 'refs/heads/main' && needs.browser.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    needs: [browser, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      BASE_URL: ${{ needs.browser.outputs.pages_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published files against this exact commit
        run: node tests/deployed.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Repeat browser, dense-layout and classic checks on the published site
        run: |
          node tests/browser.mjs
          node tests/stress.mjs
          node tests/classic.mjs
      - name: Verify real saving from the published origin
        env:
          QA_GITHUB_TOKEN: ${{ github.token }}
        run: node tests/live-github.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warehouse-city-deployed-qa
          path: qa-evidence/
          retention-days: 14
